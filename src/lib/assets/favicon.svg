<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Yens Loff</title>
  <!-- The cup from the logo, redrawn with heavier strokes and wider gaps so it survives at 16px.
       Seal green tile on light browser themes; on dark themes the green would sink into the tab,
       so the colours flip to a paper tile with a green cup. -->
  <style>
    .tile { fill: #184A3C; }
    .glyph { stroke: #E6E9EC; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #E6E9EC; }
      .glyph { stroke: #184A3C; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="14"/>
  <g class="glyph" transform="translate(32 32) scale(1.06) translate(-26.75 -31.75)" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M31 9.5c3.4 1.7 3.4 5.2 0 8.4"/>
    <path d="M26 32h12"/>
    <path d="M27 24h-3a5 5 0 0 0-5 5v20a5 5 0 0 0 5 5h3"/>
    <path d="M37 24h3a5 5 0 0 1 5 5v20a5 5 0 0 1-5 5h-3"/>
    <path d="M12.5 33H11a2.5 2.5 0 0 0-2.5 2.5v6A2.5 2.5 0 0 0 11 44h1.5"/>
  </g>
</svg>
